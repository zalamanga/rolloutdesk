server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /healthz { access_log off; return 200 "ok"; }
  location = /openapi.json { default_type application/json; try_files $uri =404; expires -1; }
  location = /postman.collection.json { default_type application/json; try_files $uri =404; expires -1; }
  location = /postman.environment.example.json { default_type application/json; try_files $uri =404; expires -1; }
  location ~ ^/(api/|client/v1/) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 15s;
    proxy_next_upstream off;
  }
  location /assets/ { try_files $uri =404; expires 1y; }
  location / { try_files $uri $uri/ /index.html; expires -1; }
}
